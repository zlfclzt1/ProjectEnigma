[package]
name = "azeroth-guild-chronicle"
version = "0.1.0-alpha.1"
description = "A local macOS launcher for Azeroth Guild Chronicle"
authors = ["lingfeng"]
license = ""
repository = "https://github.com/zlfclzt1/ProjectEnigma"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "azeroth_guild_chronicle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
